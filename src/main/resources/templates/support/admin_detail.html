<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>문의 상세 - 관리자</title>

    <link th:href="@{/webjars/bootstrap/4.5.2/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>

    <style>
        .badge-status { font-weight: 600; }
        .reply-card { border-left: 4px solid #007bff; margin-bottom: 1rem; }
        .reply-staff { background: #f8f9fa; border-left-color: #28a745; }
        .reply-meta { font-size: 0.85rem; color: #666; margin-bottom: .5rem; }
        .attachment-list li { margin-bottom: .25rem; }
        pre { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand font-weight-bold" th:href="@{/}">Shopping Mall</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto"></ul>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/support/admin}">문의글 관리</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">

    <!-- Alerts -->
    <div th:if="${toast}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${toast}">완료되었습니다.</span>
        <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">오류가 발생했습니다.</span>
        <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">문의 상세 (관리자)</h3>
        <a class="btn btn-outline-secondary" th:href="@{/support/admin}">목록으로</a>
    </div>

    <!-- 기본 정보 -->
    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${ticket.title}">제목</h5>
            <p class="mb-1 text-muted">
                <strong th:text="${ticket.userName}">홍길동</strong>
                <span class="ml-2" th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}">2025-10-06 13:00</span>
            </p>
            <p>
                <span class="badge badge-info" th:text="${ticket.category}">CATEGORY</span>
                <span class="badge badge-status"
                      th:classappend="${ticket.status.name()=='OPEN'     ? ' badge-secondary' :
                             (ticket.status.name()=='ANSWERED' ? ' badge-info' :
                             (ticket.status.name()=='CLOSED'   ? ' badge-success' : ' badge-light'))}"
                      th:text="${ticket.status}">
          OPEN
        </span>
                <span th:if="${ticket.isPrivate}" class="badge badge-danger ml-1">비공개</span>
            </p>
            <hr/>
            <pre th:text="${ticket.content}">문의 내용</pre>

            <!-- 첨부파일 -->
            <div th:if="${ticket.attachments != null and !ticket.attachments.isEmpty()}" class="mt-3">
                <h6>첨부파일</h6>
                <ul class="attachment-list">
                    <li th:each="att : ${ticket.attachments}">
                        <a th:href="${att.url}" target="_blank" th:text="${att.fileName}">file.jpg</a>
                        <small class="text-muted"
                               th:text="${T(java.lang.Math).round(att.size / 1024.0)} + ' KB'"></small>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 상태 변경 -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{|/support/admin/${ticket.id}/status|}" method="post" class="form-inline">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label class="mr-2 font-weight-bold">상태 변경:</label>
                <select class="form-control mr-2" name="status">
                    <option th:each="s : ${T(capstone.capstone_shop.domain.TicketStatus).values()}"
                            th:value="${s}" th:text="${s}"
                            th:selected="${ticket.status == s}"></option>
                </select>
                <button class="btn btn-outline-primary">변경</button>
            </form>
        </div>
    </div>

    <!-- 답변 내역 -->
    <div class="mb-4">
        <h5>답변 내역</h5>
        <div th:if="${ticket.replies.isEmpty()}" class="text-muted">등록된 답변이 없습니다.</div>

        <div th:each="r : ${ticket.replies}"
             th:classappend="${r.staffReply} ? 'reply-card reply-staff card' : 'reply-card card'">
            <div class="card-body">
                <div class="reply-meta">
                    <strong th:text="${r.authorName}">작성자</strong>
                    <span th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    <span th:if="${r.staffReply}" class="badge badge-success ml-1">관리자</span>
                </div>
                <pre th:text="${r.content}">내용</pre>
            </div>
        </div>
    </div>

    <!-- 관리자 답변 등록 -->
    <div class="card mb-5">
        <div class="card-body">
            <form th:action="@{|/support/admin/${ticket.id}/reply|}" method="post">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label for="reply">관리자 답변</label>
                    <textarea id="reply" name="content" class="form-control" rows="5"
                              placeholder="답변 내용을 입력하세요" required></textarea>
                </div>
                <div class="text-right">
                    <button type="submit" class="btn btn-primary">등록</button>
                </div>
            </form>
        </div>
    </div>

</div>

<footer class="footer bg-light text-center py-3 mt-4">
    <div class="container">
        <span class="text-muted">© 2025 Spring Shopping Mall</span>
    </div>
</footer>

<script th:src="@{/webjars/jquery/3.5.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/4.5.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
