<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>문의 등록</title>

    <link th:href="@{/webjars/bootstrap/4.5.2/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand font-weight-bold" th:href="@{/}">Shopping Mall</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto"></ul>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/support}">내 문의 목록</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">

    <!-- Alerts -->
    <div th:if="${toast}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${toast}">완료되었습니다.</span>
        <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">오류가 발생했습니다.</span>
        <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">고객센터 문의 등록</h3>
        <a class="btn btn-outline-secondary" th:href="@{/support}">내 문의 목록</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/support/new}" th:object="${form}" method="post" enctype="multipart/form-data">
                <!-- CSRF (null 안전) -->
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="title">제목</label>
                    <input id="title" type="text" class="form-control" th:field="*{title}" required
                           placeholder="문의 제목을 입력하세요"/>
                </div>

                <div class="form-group">
                    <label for="category">카테고리</label>
                    <select id="category" class="form-control" th:field="*{category}" required>
                        <option value="" th:selected="${form.category} == null">카테고리 선택</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="content">내용</label>
                    <textarea id="content" class="form-control" th:field="*{content}" rows="8" required
                              placeholder="문의 내용을 자세히 입력해주세요."></textarea>
                </div>

                <div class="form-group form-check">
                    <input id="isPrivate" type="checkbox" class="form-check-input" th:field="*{isPrivate}"/>
                    <label class="form-check-label" for="isPrivate">비공개로 등록</label>
                </div>

                <div class="form-group">
                    <label for="files">첨부파일</label>
                    <input id="files" type="file" name="files" class="form-control-file" multiple/>
                    <small class="text-muted d-block mt-1">여러 파일 선택 가능</small>
                </div>

                <div class="text-right">
                    <a class="btn btn-outline-secondary" th:href="@{/support}">취소</a>
                    <button type="submit" class="btn btn-primary">등록</button>
                </div>
            </form>
        </div>
    </div>

</div>

<footer class="footer bg-light text-center py-3 mt-4">
    <div class="container">
        <span class="text-muted">© 2025 Spring Shopping Mall</span>
    </div>
</footer>

<script th:src="@{/webjars/jquery/3.5.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/4.5.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
