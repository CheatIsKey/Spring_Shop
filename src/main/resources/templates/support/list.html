<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>내 문의 목록</title>

    <link th:href="@{/webjars/bootstrap/4.5.2/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>

    <style>
        .badge-status { font-weight: 600; }
        .table td, .table th { vertical-align: middle; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand font-weight-bold" th:href="@{/}">Shopping Mall</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto"></ul>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/support/new}">문의하기</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">

    <!-- Alerts -->
    <div th:if="${toast}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${toast}">완료되었습니다.</span>
        <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">오류가 발생했습니다.</span>
        <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">내 문의 목록</h3>
        <a class="btn btn-primary" th:href="@{/support/new}">문의하기</a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div th:if="${tickets == null or tickets.totalElements == 0}" class="p-4 text-muted">
                등록한 문의가 없습니다.
            </div>

            <div th:if="${tickets != null and tickets.totalElements > 0}">
                <table class="table table-hover mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th style="width: 90px;">번호</th>
                        <th>제목</th>
                        <th style="width: 140px;">카테고리</th>
                        <th style="width: 120px;">상태</th>
                        <th style="width: 170px;">작성일</th>
                        <th style="width: 110px;">비공개</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${tickets.content}">
                        <td th:text="${t.id}">1</td>
                        <td>
                            <a th:href="@{|/support/${t.id}|}" th:text="${t.title}">제목</a>
                        </td>
                        <td th:text="${t.category}">CATEGORY</td>
                        <td>
              <span class="badge badge-status"
                    th:classappend="${t.status.name()=='OPEN'     ? ' badge-secondary' :
                                     (t.status.name()=='ANSWERED' ? ' badge-info' :
                                     (t.status.name()=='CLOSED'   ? ' badge-success' : ' badge-light'))}"
                    th:text="${t.status}">OPEN</span>
                        </td>
                        <td th:text="${#temporals.format(t.createdAt, 'yyyy-MM-dd HH:mm')}">2025-10-06 13:00</td>
                        <td th:text="${t.isPrivate ? '예' : '아니오'}">아니오</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <nav th:if="${tickets != null and tickets.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${tickets.first} ? ' disabled'">
                <a class="page-link" th:href="@{|/support?page=${tickets.number-1}&size=${tickets.size}|}">이전</a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, tickets.totalPages-1)}"
                th:classappend="${i == tickets.number} ? ' active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{|/support?page=${i}&size=${tickets.size}|}">1</a>
            </li>

            <li class="page-item" th:classappend="${tickets.last} ? ' disabled'">
                <a class="page-link" th:href="@{|/support?page=${tickets.number+1}&size=${tickets.size}|}">다음</a>
            </li>
        </ul>
    </nav>

</div>

<footer class="footer bg-light text-center py-3 mt-4">
    <div class="container">
        <span class="text-muted">© 2025 Spring Shopping Mall</span>
    </div>
</footer>

<script th:src="@{/webjars/jquery/3.5.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/4.5.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
