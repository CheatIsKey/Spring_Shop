<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>문의글 관리</title>

    <link th:href="@{/webjars/bootstrap/4.5.2/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>

    <style>
        .badge-status { font-weight: 600; }
        .table td, .table th { vertical-align: middle; }
        .filters .form-control, .filters .form-select { min-width: 140px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand font-weight-bold" th:href="@{/}">Shopping Mall</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto"></ul>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/support/admin}">문의글 관리</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container mt-4">

    <!-- Alerts -->
    <div th:if="${toast}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${toast}">완료되었습니다.</span>
        <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">오류가 발생했습니다.</span>
        <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">문의글 관리</h3>
        <a class="btn btn-outline-light d-none" href="#">.</a>
    </div>

    <!-- 필터/검색 -->
    <form class="card mb-3" method="get" th:action="@{/support/admin}">
        <div class="card-body">
            <div class="form-row filters">
                <div class="col-auto">
                    <label class="sr-only">상태</label>
                    <select class="form-control" name="status">
                        <!-- 변경: th:value="" => value="" -->
                        <option value="" th:selected="${status == null}">전체 상태</option>
                        <option th:each="s : ${T(capstone.capstone_shop.domain.TicketStatus).values()}"
                                th:value="${s}" th:text="${s}"
                                th:selected="${status == s}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="sr-only">카테고리</label>
                    <select class="form-control" name="category">
                        <!-- 변경: th:value="" => value="" -->
                        <option value="" th:selected="${category == null}">전체 카테고리</option>
                        <option th:each="c : ${T(capstone.capstone_shop.domain.TicketCategory).values()}"
                                th:value="${c}" th:text="${c}"
                                th:selected="${category == c}"></option>
                    </select>
                </div>
                <div class="col">
                    <label class="sr-only">키워드</label>
                    <input type="text" class="form-control" name="keyword" placeholder="제목/내용/아이디/이름"
                           th:value="${keyword}">
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary">검색</button>
                </div>
            </div>
        </div>
    </form>

    <!-- 목록 -->
    <div class="card">
        <div class="card-body p-0">
            <div th:if="${tickets == null or tickets.totalElements == 0}" class="p-4 text-muted">
                검색 결과가 없습니다.
            </div>

            <div th:if="${tickets != null and tickets.totalElements > 0}">
                <table class="table table-hover mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th style="width: 90px;">번호</th>
                        <th>제목</th>
                        <th style="width: 140px;">카테고리</th>
                        <th style="width: 120px;">상태</th>
                        <th style="width: 170px;">작성일</th>
                        <th style="width: 110px;">비공개</th>
                        <th style="width: 130px;">관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${tickets.content}">
                        <td th:text="${t.id}">1</td>
                        <td>
                            <a th:href="@{|/support/admin/${t.id}|}" th:text="${t.title}">제목</a>
                        </td>
                        <td th:text="${t.category}">CATEGORY</td>
                        <td>
              <span class="badge badge-status"
                    th:classappend="${t.status.name()=='OPEN'     ? ' badge-secondary' :
                                     (t.status.name()=='ANSWERED' ? ' badge-info' :
                                     (t.status.name()=='CLOSED'   ? ' badge-success' : ' badge-light'))}"
                    th:text="${t.status}">OPEN</span>
                        </td>
                        <td th:text="${#temporals.format(t.createdAt, 'yyyy-MM-dd HH:mm')}">2025-10-06 13:00</td>
                        <td th:text="${t.isPrivate ? '예' : '아니오'}">아니오</td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{|/support/admin/${t.id}|}">보기</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <nav th:if="${tickets != null and tickets.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${tickets.first} ? ' disabled'">
                <a class="page-link"
                   th:href="@{|/support/admin?page=${tickets.number-1}&size=${tickets.size}
               &status=${status}&category=${category}&keyword=${keyword}|}">이전</a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, tickets.totalPages-1)}"
                th:classappend="${i == tickets.number} ? ' active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{|/support/admin?page=${i}&size=${tickets.size}
               &status=${status}&category=${category}&keyword=${keyword}|}">1</a>
            </li>

            <li class="page-item" th:classappend="${tickets.last} ? ' disabled'">
                <a class="page-link"
                   th:href="@{|/support/admin?page=${tickets.number+1}&size=${tickets.size}
               &status=${status}&category=${category}&keyword=${keyword}|}">다음</a>
            </li>
        </ul>
    </nav>

</div>

<footer class="footer bg-light text-center py-3 mt-4">
    <div class="container">
        <span class="text-muted">© 2025 Spring Shopping Mall</span>
    </div>
</footer>

<script th:src="@{/webjars/jquery/3.5.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/4.5.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
