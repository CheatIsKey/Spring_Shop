# application-cloud.yml

spring:
  config:
    activate:
      on-profile: cloud
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 604800

  datasource:
    url: jdbc:postgresql://google/${DB_NAME}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${INSTANCE_CONNECTION_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100
        hbm2ddl:
          auto: none

  flyway:
    enabled: true
    default-schema: public
    schemas: public
    create-schemas: true

  sql:
    init:
      mode: never

  cloud:
    gcp:
      storage:
        bucket: ${GCS_BUCKET}

file:
  upload-dir: /tmp/uploads

app:
  storage: gcs

gcs:
  bucket: ${GCS_BUCKET}
  enabled: true

server:
  port: ${PORT:8080}

